<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniMind - Table QR Standees</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; padding: 0 !important; }
      .qr-card { page-break-after: always; box-shadow: none !important; border: 2px solid #ea580c !important; margin-bottom: 0 !important; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 font-sans text-slate-800">

  <!-- TOP ACTION BAR -->
  <div class="no-print max-w-md mx-auto mb-6 bg-white p-4 rounded-2xl shadow-md border border-slate-200 text-center sticky top-2 z-50">
    <h2 class="text-base font-black text-slate-900">Table QR Standees (1 to 10)</h2>
    <p class="text-xs text-slate-500 mb-3">క్రింది బటన్ నొక్కి మీ మొబైల్‌లోనే PDF గా సేవ్ చేసుకోండి</p>
    <button onclick="window.print()" class="w-full bg-orange-600 hover:bg-orange-700 active:scale-95 text-white font-black text-sm py-3 rounded-xl shadow-lg shadow-orange-600/30 flex items-center justify-center gap-2 transition">
      <i class="fa-solid fa-print"></i> 🖨️ Print / Save as PDF
    </button>
  </div>

  <!-- QR CARDS CONTAINER -->
  <div id="qrCardsWrapper" class="max-w-md mx-auto space-y-8"></div>

  <script>
    const baseUrl = "https://feelgood1911feellucky-afk.github.io/powered-by-Mini-Mind/index.html?table=";
    const container = document.getElementById("qrCardsWrapper");

    let cardsHtml = "";

    for (let t = 1; t <= 10; t++) {
      const targetUrl = baseUrl + t;
      // High-resolution live QR API
      const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=350x350&data=${encodeURIComponent(targetUrl)}&margin=1`;

      cardsHtml += `
        <div class="qr-card bg-white rounded-3xl p-6 shadow-md border-2 border-orange-500 text-center flex flex-col items-center justify-between min-h-[500px]">
          
          <!-- BRAND HEADER -->
          <div class="pt-2">
            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-0.5">Powered by</span>
            <h1 class="text-3xl font-black text-orange-500 tracking-wide flex items-center justify-center gap-2">
              <i class="fa-solid fa-brain text-2xl"></i> MiniMind
            </h1>
            <p class="text-[10px] font-extrabold text-slate-500 tracking-wider uppercase mt-1">Smart Digital Dine-in</p>
          </div>

          <!-- TABLE BADGE -->
          <div class="my-4">
            <span class="bg-slate-900 text-white font-black text-lg px-8 py-2 rounded-full tracking-widest shadow">
              TABLE ${t}
            </span>
          </div>

          <!-- QR CODE BOX -->
          <div class="p-3 bg-orange-50 border-2 border-orange-200 rounded-2xl shadow-inner inline-block my-2">
            <img src="${qrApiUrl}" alt="Table ${t} QR" class="w-56 h-56 rounded-xl block bg-white">
          </div>

          <!-- INSTRUCTIONS -->
          <div class="space-y-1 my-3">
            <p class="text-sm font-black text-slate-900">మెనూ చూసి ఆర్డర్ చేయడానికి స్కాన్ చేయండి</p>
            <p class="text-[11px] font-bold text-slate-500">Scan with Camera or any UPI App to Order</p>
          </div>

          <!-- FEATURES FOOTER -->
          <div class="w-full grid grid-cols-3 gap-1 bg-orange-50/80 border border-orange-200 rounded-xl py-2 px-1 text-[9px] font-black text-orange-800">
            <div>⚡ Fast Menu</div>
            <div>🍳 Live Kitchen</div>
            <div>💳 Instant Pay</div>
          </div>

          <!-- URL SMALL -->
          <p class="text-[8px] text-slate-300 font-mono mt-3 break-all">${targetUrl}</p>
        </div>
      `;
    }

    container.innerHTML = cardsHtml;
  </script>
</body>
</html>
